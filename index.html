<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>常頌 SEMPER</title>
<meta name="apple-mobile-web-app-title" content="常頌">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<script>try { if (JSON.parse(localStorage.getItem('rike.skipWelcome'))) document.documentElement.classList.add('nowelcome'); } catch (e) {}</script>
</head>
<body>
<div id="welcome" class="welcome">
  <div class="welcome-in">
    <img src="icons/icon-512.png" alt="" class="welcome-logo">
    <h1>SEMPER</h1>
    <p class="welcome-zh">常頌</p>
    <blockquote class="welcome-verse">「我要時時讚美上主，<br>我的口舌不斷讚頌上主。」<cite>聖詠 34:2</cite><span class="welcome-lat">SEMPER 是拉丁文，意即「常常」，出自這節聖詠。</span></blockquote>
    <div class="welcome-script"><button data-script="t" class="pill">繁體字</button><button data-script="s" class="pill">简体字</button></div>
    <label class="welcome-remember"><input type="checkbox" id="welcomeSkip"> 記住我的選擇，以後不再顯示此畫面</label>
    <p class="welcome-note">此設定可隨時在「設定」中更改。</p>
    <button id="welcomeGo" class="pill wide welcome-go">進入</button>
  </div>
</div>
<header class="top">
  <div class="bar">
    <button id="prev" class="ic" aria-label="前一天">‹</button>
    <label class="datebtn"><span id="dateLabel"></span><input id="datePick" type="date" aria-label="選擇日期"></label>
    <button id="next" class="ic" aria-label="後一天">›</button>
    <button id="today" class="txt">今天</button>
    <button id="menuBtn" class="ic" aria-label="設定"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/><circle cx="8" cy="6" r="2.4" fill="var(--bg, #fff)"/><circle cx="16" cy="12" r="2.4" fill="var(--bg, #fff)"/><circle cx="8" cy="18" r="2.4" fill="var(--bg, #fff)"/></svg></button>
  </div>
  <nav id="hours" class="hours"></nav>
</header>
<div id="celebs" class="celebs"></div>
<main id="office" class="office" aria-live="polite"><p class="loading">載入中…</p></main>
<div id="settings" class="sheet" hidden>
  <div class="sheet-in">
    <h2>設定</h2>
    <p class="about"><b>SEMPER 常頌</b>　「我要時時讚美上主」（詠34:2）</p>
    <div class="row"><span>禮儀日曆</span><span id="calendars" class="pills"></span></div>
    <div class="row"><span>文字</span><button data-script="t" class="pill">繁體字</button><button data-script="s" class="pill">简体字</button></div>
    <div class="row"><span>字型</span><span class="pills"><button data-font="ming" class="pill" style="font-family:SeptiesMing,serif">明體</button><button data-font="hei" class="pill" style="font-family:SeptiesHei,sans-serif">黑體</button><button data-font="kai" class="pill" style="font-family:SeptiesKai,serif">楷體</button><button data-font="sys" class="pill" style="font-family:system-ui,sans-serif">系統</button></span></div>
    <div class="row"><span>字體大小</span><button data-fs="-1" class="pill">A−</button><button data-fs="1" class="pill">A＋</button></div>
    <div class="row"><span>外觀</span><button data-theme="light" class="pill">日間</button><button data-theme="sepia" class="pill">米黃</button><button data-theme="dark" class="pill">夜間</button></div>
    <div class="row"><span>亞孟／阿們</span><span class="pills"><button data-amen="auto" class="pill">按日曆</button><button data-amen="亞孟" class="pill">亞孟</button><button data-amen="阿們" class="pill">阿們</button></span></div>
    <label class="row"><input type="checkbox" id="rubrics" checked> 顯示說明及經文來源</label>
    <label class="row"><input type="checkbox" id="showWelcome" checked> 啟動時顯示歡迎畫面</label>
    <div id="audioSet" class="audio-set">
      <h3>朗讀錄音</h3>
      <p class="about">朗讀使用常頌錄製的語音。播放過的錄音會保存在裝置，30 日未再使用的會自動刪除。</p>
      <p class="about" id="aUse">已保存：計算中…</p>
      <p class="about">外出或沒有網絡時，可預先下載（<span id="aLang">粵語</span>，按朗讀設定的語言）：</p>
      <div class="row"><span>日期</span><span class="pills"><button class="pill" data-arange="1">今天</button><button class="pill" data-arange="7">未來 7 日</button><button class="pill" data-arange="30">未來 30 日</button></span></div>
      <div class="row arow"><span>時辰</span><span id="aHours" class="ahours"></span></div>
      <p class="about" id="aPlan"></p>
      <progress id="aProg" hidden></progress>
      <div class="row"><button id="aGo" class="pill">下載</button><button id="aStop" class="pill" hidden>取消</button><button id="aDel" class="pill adel">刪除所有錄音</button></div>
    </div>
    <p class="about">聖經經文版權屬思高聖經學會所有（《思高聖經》）。</p>
    <button id="closeSettings" class="pill wide">完成</button>
  </div>
</div>
<div id="update" class="update" hidden><button id="updateBtn">有新版本 — 按此更新</button></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
